<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Topple · Topple Studio</title>
<meta name="description" content="Topple: a one-tap stacking game on a sunny Mediterranean island, for Android and iOS.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
<style>
  :root { --bg: #fbf5ec; --ink: #3a2a3e; --soft: #6d5d70; --accent: #c8674f; --line: #ead9c6; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1c1622; --ink: #f3e9df; --soft: #c2b3c4; --accent: #f0a07f; --line: #3b2f44; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
         font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; text-align: center; }
  main { padding: 48px 20px; max-width: 560px; }
  h1 { font-family: "Luckiest Guy", system-ui, sans-serif; font-weight: 400; font-size: 64px; line-height: 1; margin: 0 0 12px; letter-spacing: .02em; color: var(--accent); }
  p { color: var(--soft); margin: 0 0 24px; }
  nav { display: flex; gap: 22px; justify-content: center; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 22px; }
  a { color: var(--accent); text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>Topple</h1>
  <p>Stack the blocks, keep the tower standing. Tap at the right moment, land it perfectly, and follow Mira's postcards across a sunny Mediterranean island, from the village pier to the festival fireworks. For Android and iOS.</p>
  <nav>
    <a href="/topple/privacy/">Privacy Policy</a>
    <a href="mailto:topplestd@gmail.com">Support</a>
    <a href="/">Topple Studio</a>
  </nav>
</main>
</body>
</html>
