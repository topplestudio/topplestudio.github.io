<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Topple Studio</title>
<meta name="description" content="Topple Studio makes small, polished mobile games, starting with Topple.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
<style>
  :root { --bg: #fbf5ec; --ink: #3a2a3e; --soft: #6d5d70; --accent: #c8674f; --line: #ead9c6; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1c1622; --ink: #f3e9df; --soft: #c2b3c4; --accent: #f0a07f; --line: #3b2f44; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
         font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; text-align: center; }
  main { padding: 48px 20px; max-width: 560px; }
  h1 { font-family: "Luckiest Guy", system-ui, sans-serif; font-weight: 400; font-size: 56px; line-height: 1.05; margin: 0 0 12px; letter-spacing: .02em; }
  .stack { display: flex; flex-direction: column; align-items: center; gap: 6px; margin: 0 auto 28px; }
  .stack span { display: block; height: 16px; border-radius: 4px; }
  p { color: var(--soft); margin: 0 0 24px; }
  nav { display: flex; gap: 22px; justify-content: center; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 22px; }
  a { color: var(--accent); text-decoration: none; font-weight: 600; }
  .games { margin: 0 0 28px; }
  .game { display: block; padding: 16px 20px; border: 1px solid var(--line); border-radius: 14px; color: var(--ink); text-align: left; }
  .game strong { display: block; font-family: "Luckiest Guy", system-ui, sans-serif; font-weight: 400; font-size: 26px; color: var(--accent); }
  .game span { color: var(--soft); font-weight: 400; }
</style>
</head>
<body>
<main>
  <div class="stack" aria-hidden="true">
    <span style="width:70px;background:#c8674f"></span>
    <span style="width:96px;background:#dc9985;margin-left:14px"></span>
    <span style="width:120px;background:#ebcc9e"></span>
    <span style="width:140px;background:#7fb3b3"></span>
  </div>
  <h1>Topple Studio</h1>
  <p>Small, polished mobile games.</p>
  <section class="games">
    <a class="game" href="/topple/">
      <strong>Topple</strong>
      <span>A one-tap stacking game on a sunny Mediterranean island. Android and iOS.</span>
    </a>
  </section>
  <nav>
    <a href="mailto:topplestd@gmail.com">topplestd@gmail.com</a>
  </nav>
</main>
</body>
</html>
